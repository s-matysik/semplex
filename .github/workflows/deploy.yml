name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Engine tests (agreement with lavaan)
        run: |
          pip install numpy scipy pandas openpyxl pytest
          python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Interface test (Polish)
        run: npm run test:ui
      - name: Interface test (English)
        run: npm run test:ui
        env:
          SX_LANG: en

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
